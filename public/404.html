<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not found | Prefill</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
    <script>try{const t=localStorage.getItem('prefill:theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch{}</script>
  </head>
  <body>
    <main class="wrap hero">
      <h1 class="display">Page <span class="swash">not found</span>.</h1>
      <p class="lead">This page does not exist.</p>
      <a class="btn btn--primary pixel" href="/">Go home</a>
    </main>
  </body>
</html>
